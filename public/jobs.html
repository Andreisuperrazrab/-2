<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пошук роботи — Bounty Hunter</title>
  
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body class="">
<header class="site-header"><a class="logo" href="home.html" aria-label="Bounty Hunter — на головну"><img src="assets/logo.svg" alt="Bounty Hunter"></a><nav class="site-nav" aria-label="Основна навігація"><a href="freelancers.html">Пошук працівників</a><a href="jobs.html" aria-current="page">Пошук роботи</a><a href="chat.html">Чат</a><a href="index.html" data-logout>Вийти</a></nav></header>
<main class="container">
  <h1 class="page-title">Пошук роботи</h1>
  <div class="page-actions"><button class="btn" id="new-job" type="button" hidden>+ Додати вакансію</button><a class="btn btn--outline" href="applications.html">Мої заявки</a></div>
  <form class="toolbar" id="filters" role="search">
    <div class="field"><label for="j-cat">область роботи</label>
      <select class="select" id="j-cat" data-filter="category"><option value="">Усі</option><option value="frontend">Frontend</option><option value="backend">Backend</option><option value="fullstack">Fullstack</option></select></div>
    <div class="field"><label for="j-lvl">рівень знань</label>
      <select class="select" id="j-lvl" data-filter="level"><option value="">Усі</option><option value="junior">junior</option><option value="middle">middle</option><option value="senior">senior</option></select></div>
    <div class="field search"><label class="visually-hidden" for="j-q">Пошук</label><input class="input" id="j-q" type="search" placeholder="пошук роботи" data-search></div>
  </form>
  <ul class="results" id="results" style="list-style:none;margin:0;padding:0 0 48px"></ul>
  <p class="empty" id="empty" hidden>Вакансій не знайдено. Змініть фільтри.</p>

  <dialog class="modal" id="job-modal" aria-labelledby="job-modal-title">
    <form id="job-editor" novalidate>
      <h2 id="job-modal-title">Нова вакансія</h2>
      <div class="field"><label for="e-title">Назва вакансії</label><input id="e-title" class="input" maxlength="140" required></div>
      <div class="field"><label for="e-company">Компанія</label><input id="e-company" class="input" maxlength="140" required></div>
      <div class="field"><label for="e-category">Напрям</label><select class="select" id="e-category"><option value="frontend">Frontend</option><option value="backend">Backend</option><option value="fullstack">Fullstack</option></select></div>
      <div class="field"><label for="e-level">Рівень</label><select class="select" id="e-level"><option value="junior">junior</option><option value="middle">middle</option><option value="senior">senior</option></select></div>
      <div class="field"><label for="e-budget">Бюджет</label><input id="e-budget" class="input" required maxlength="140" placeholder="від 1000 $"></div>
      <div class="field"><label for="e-deadline">Термін</label><input id="e-deadline" class="input" required maxlength="140" placeholder="30 днів"></div>
      <div class="field"><label for="e-format">Формат</label><input id="e-format" class="input" required maxlength="140" placeholder="Віддалено"></div>
      <div class="field"><label for="e-description">Опис (не менше 20 символів)</label><textarea id="e-description" class="textarea" required minlength="20" maxlength="3000"></textarea></div>
      <p id="job-form-error" class="form-error" role="alert"></p>
      <div class="actions"><button type="button" id="job-editor-cancel" class="btn btn--outline">Скасувати</button><button type="submit" class="btn">Зберегти</button></div>
    </form>
  </dialog>
</main>
<footer class="site-footer">
  <a href="help.html">виникли проблеми ?</a>
  <a href="about.html">Про сайт</a>
  <div class="social"><a href="https://facebook.com" aria-label="Facebook"><img src="assets/facebook.svg" alt="Facebook"></a><a href="https://instagram.com" aria-label="Instagram"><img src="assets/instagram.svg" alt="Instagram"></a></div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
